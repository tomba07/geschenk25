services:
  - type: web
    name: geschenk25-web
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://geschenk25-api.onrender.com
    headers:
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
      - path: /.well-known/assetlinks.json
        name: Content-Type
        value: application/json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: geschenk25-api
    runtime: node
    buildCommand: npm install --production=false && npm run build:api
    startCommand: npm run start:api
    preDeployCommand: npm run migrate:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: geschenk25-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: geschenk25-db
    databaseName: geschenk25
    user: geschenk25_user
