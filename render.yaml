services:
  - type: web
    name: geschenk25-web
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://geschenk25-api.onrender.com
    headers:
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
      - path: /.well-known/assetlinks.json
        name: Content-Type
        value: application/json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: geschenk25-api
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build:api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: true
      - key: APP_BASE_URL
        value: https://geschenk25-web.onrender.com
      - key: API_BASE_URL
        value: https://geschenk25-api.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: geschenk25-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: geschenk25-db
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: geschenk25
    user: geschenk25_user
