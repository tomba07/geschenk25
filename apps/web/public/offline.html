<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1559b7" />
    <title>Geschenk is offline</title>
    <style>
      :root {
        color: #08245a;
        background: #eef5ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 12%, rgb(255 255 255 / 0.86), rgb(238 245 255 / 0) 34%),
          #eef5ff;
      }

      main {
        width: min(100%, 460px);
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
        padding: 34px 26px;
        border: 1px solid #cfe0f7;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgb(8 36 90 / 0.12);
      }

      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        line-height: 1.12;
      }

      p {
        color: #40567a;
        font-size: 16px;
        line-height: 1.5;
      }

      button {
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        background: #1559b7;
        color: #ffffff;
        padding: 0 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicons/icon-512x512.png" alt="" />
      <h1>You are offline</h1>
      <p>Geschenk needs a connection to load fresh groups, friends, and gift ideas. Try again once you are back online.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
